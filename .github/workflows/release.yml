name: Build & Release

# Unlike dsh-skin-pack, users install this repo via github:keman-ai/dsh-skin-market
# (a git source), so lib/ must be committed and CI does not handle distribution.
# Releases exist here for two reasons:
#   - a tarball for anyone pinning a version (faster than cloning, and it triggers
#     no build-script authorisation)
#   - a traceable marker per version: what changed, and when it shipped
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a Release needs write access
    steps:
      - uses: actions/checkout@v4

      # No version here: the action also reads packageManager from package.json, and
      # specifying both fails with "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v4

      # Match the dev machine. lib/ is committed and the gate below compares build output
      # byte for byte — a different Node major can change the output and turn the gate
      # into a false alarm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # lib/ is committed (git-source installs depend on it). If a build disagrees with
      # what was committed, someone changed source without committing output — users
      # would install stale code, so this must fail
      - name: Assert lib/ is up to date
        run: |
          if ! git diff --quiet -- lib; then
            echo "::error::lib/ is out of sync with the source. Run pnpm build locally and commit lib/ too"
            git diff --stat -- lib
            exit 1
          fi

      - name: Release if version is new
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs
